[program:laravel-octane-demo]
directory=/www/wwwroot/demo.belajarcerdas.id
command=/www/server/php/83/bin/php artisan octane:start --server=frankenphp --host=127.0.0.1 --port=8000 --workers=8 --max-requests=5000
user=www
numprocs=1
process_name=%(program_name)s_00
autostart=true
autorestart=true
startsecs=5
startretries=10
stopwaitsecs=15
; stop the whole process group so frankenphp (child of artisan) dies with it
stopasgroup=true
killasgroup=true
stdout_logfile=/www/server/panel/plugin/supervisor/log/laravel-octane-demo.out.log
stderr_logfile=/www/server/panel/plugin/supervisor/log/laravel-octane-demo.err.log
